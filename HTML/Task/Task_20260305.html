<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task 20260305</title>
        <link rel="stylesheet" href="../../CSS/Task/Task_20260305.css">
    </head>
    <body>
        <form>
            <fieldset>
                <legend>Contact Us</legend>
                <table>
                    <tr>
                        <th>First Name</th>
                        <th>Last Name</th>
                    </tr>
                    <tr>
                        <td><input type="text" name="firstName" placeholder="Enter your first name"></td>
                        <td><input type="text" name="lastName" placeholder="Enter your last name"></td>
                    </tr>
                    <tr>
                        <th>Email</th>
                        <th>Phone Number</th>
                    </tr>
                    <tr>
                        <td><input type="email" name="email" placeholder="Enter your email"></td>
                        <td><input type="tel" name="phone" placeholder="Enter your phone number"></td>
                    </tr>
                    <tr>
                        <th colspan="2">
                            <label for="message">What do you have in mind?</label>
                        </th>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <textarea id="message" name="message" placeholder="Write your message here..."></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <button type="submit">Submit</button>
                        </td>
                    </tr>
                </table>
            </fieldset>
        </form>
    </body>
</html>
