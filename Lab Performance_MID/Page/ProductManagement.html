<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Management</title>
        <link rel="stylesheet" href="../Design/ProductManagement.css">
    </head>
    <body>
        <div class="productManagementForm">
           <form>
            <fieldset>
                <legend>Product Management Page</legend>
                <label for="Unit_Price">Unit Price:</label><br>
                <input type="number" id="unitPrice" name="Unit_Price" value="1000" readonly><br><br>
                <label for="Quantity">Quantity Per Day:</label><br>
                <input type="number" id="quantity" name="Quantity" value="0"><br><br>
                <label for="Price">Total Price For 30 Days:</label><br>
                <input type="number" id="price" name="Price" value="0" readonly><br><br>   
            </fieldset>
           </form> 
        </div>
        <script src="../JS/ProductManagement.js"></script>
    </body>
</html>
